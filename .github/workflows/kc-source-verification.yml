name: KC Source Reconciliation Verification

on:
  push:
    branches:
      - governance/kc-sc0-sc1-reconciliation-v0.1
    paths:
      - 'source/KottonsCode_DraftOne.docx'
      - 'tools/reconciliation/kc_source_verify.py'

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Verify source bytes
        run: python3 tools/reconciliation/kc_source_verify.py
